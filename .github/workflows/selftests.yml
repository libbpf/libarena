name: Selftests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  KBUILD_BUILD_USER: libarena
  KBUILD_BUILD_HOST: github-actions
  # Shared bpftool needs no LLVM disassembler library.
  LLVM_CONFIG: /bin/false

jobs:
  pahole:
    name: Prepare pahole
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache pahole
        id: pahole-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pahole.tar.gz
          key: pahole-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/vmtest/build-pahole.sh') }}-v1

      - name: Build pahole
        if: steps.pahole-cache.outputs.cache-hit != 'true'
        run: sudo bash .github/vmtest/build-pahole.sh "$RUNNER_TEMP/pahole.tar.gz"

      - name: Upload pahole
        uses: actions/upload-artifact@v4
        with:
          name: pahole-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pahole.tar.gz
          if-no-files-found: error

  kernels:
    name: Prepare kernel ${{ matrix.kernel }}
    needs: pahole
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.16', '7.1', bpf-next]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install kernel build dependencies
        run: sudo bash .github/vmtest/install-deps.sh

      - name: Download pahole
        uses: actions/download-artifact@v4
        with:
          name: pahole-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pahole

      - name: Install pahole
        run: sudo bash .github/vmtest/install-pahole.sh "$RUNNER_TEMP/pahole/pahole.tar.gz"

      - name: Resolve the kernel snapshot
        id: kernel
        env:
          KERNEL: ${{ matrix.kernel }}
        run: bash .github/vmtest/kernel-ref.sh "$KERNEL" >> "$GITHUB_OUTPUT"

      - name: Cache VM root image
        uses: actions/cache@v4
        with:
          path: ~/.bpf_selftests/root.img
          key: vmtest-rootfs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Cache kernel build
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kernel.tar.zst
          key: kernel-build-${{ steps.kernel.outputs.revision }}

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Build the kernel and its tools
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          # Optional bpftool BPF features are unnecessary for these tests.
          CLANG: /bin/false
          O: ${{ runner.temp }}/kernel-build
          KERNEL_REPOSITORY: ${{ steps.kernel.outputs.repository }}
          KERNEL_REVISION: ${{ steps.kernel.outputs.revision }}
        run: |
          bash .github/vmtest/build-kernel.sh \
            2>&1 | tee "$RUNNER_TEMP/kernel-build.log"

      - name: Upload the kernel build
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}
          path: ${{ runner.temp }}/kernel.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Upload kernel build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.kernel }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kernel-build.log
            ~/.bpf_selftests/*.log
            ~/.bpf_selftests/*.exit_status
            ~/.bpf_selftests/latest.config

  selftests:
    name: All selftests on ${{ matrix.kernel }} / Clang ${{ matrix.clang }}
    needs: [pahole, kernels]
    if: ${{ !cancelled() && needs.pahole.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.16', '7.1', bpf-next]
        clang: [21, 22, 23]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install LLVM ${{ matrix.clang }}
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          sudo bash .github/vmtest/install-deps.sh "$CLANG_VERSION"
          echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Download pahole
        uses: actions/download-artifact@v4
        with:
          name: pahole-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/pahole

      - name: Install pahole
        run: sudo bash .github/vmtest/install-pahole.sh "$RUNNER_TEMP/pahole/pahole.tar.gz"

      - name: Download the kernel build
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.kernel }}
          path: ${{ runner.temp }}

      - name: Restore the kernel build
        run: |
          tar --zstd -xf "$RUNNER_TEMP/kernel.tar.zst" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.bpf_selftests" "$RUNNER_TEMP/libarena-ci"
          mv "$RUNNER_TEMP/latest.config" "$HOME/.bpf_selftests/latest.config"
          git -C "$RUNNER_TEMP/linux" rev-parse HEAD > "$RUNNER_TEMP/libarena-ci/kernel-commit.txt"
          git -C vendor/libbpf rev-parse HEAD > "$RUNNER_TEMP/libarena-ci/libbpf-commit.txt"
          clang --version | tee "$RUNNER_TEMP/libarena-ci/compiler.txt"

      - name: Cache VM root image
        uses: actions/cache@v4
        with:
          path: ~/.bpf_selftests/root.img
          key: vmtest-rootfs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Build and run every selftest
        env:
          ASAN: ${{ matrix.clang == 23 && '1' || '0' }}
          O: ${{ runner.temp }}/kernel-build
        run: |
          timeout --kill-after=1m 130m bash ./kerneltest.sh "$RUNNER_TEMP/linux" -- --verbose \
            2>&1 | tee "$RUNNER_TEMP/libarena-ci/console.log"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftests-${{ matrix.kernel }}-clang${{ matrix.clang }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/libarena-ci/console.log
            ~/.bpf_selftests/*.log
            ~/.bpf_selftests/*.exit_status
            ~/.bpf_selftests/latest.config
            ${{ runner.temp }}/libarena-ci/*-commit.txt
            ${{ runner.temp }}/libarena-ci/compiler.txt

  all-selftests:
    name: All selftests passed
    needs: selftests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all three kernels to pass
        env:
          RESULT: ${{ needs.selftests.result }}
        run: test "$RESULT" = success
