name: Refresh bpf-next build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-bpf-next
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clear the main bpf-next cache
        shell: bash
        run: |
          gh cache list --ref refs/heads/main --key bpf-next --limit 1000 --json id --jq '.[].id' |
            xargs -r -n1 gh cache delete

  warm:
    needs: reset
    uses: ./.github/workflows/selftests.yml
    with:
      update-bpf-next: true
      kernels: '["bpf-next"]'
